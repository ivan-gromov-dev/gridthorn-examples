[workspace]
members = [
    "composed-controls",
    "localization",
    "multilingual-text",
    "text-input",
    "desktop-input",
    "tycoon_slice",
    "world-saving",
    "scenarios-snapshots",
    "headless-simulation",
    "simulation-clock",
    "pathfinding",
    "grid-placement",
    "tilemap-basics",
    "classic_2d",
    "grid-coordinates",
    "asset-reload",
    "collision-basics",
    "reflection-basics",
    "scene-serialization",
    "deterministic-replay",
    "diagnostics-flow",
    "headless-schedule",
    "runtime-input",
    "schedule-loop",
    "window-surface",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
